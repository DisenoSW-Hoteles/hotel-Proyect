# ============================================================================
#  SonarQube (self-hosted UCT) — Configuración de análisis de calidad
#  Servidor: https://sonarqube.inf.uct.cl
# ============================================================================
#  IMPORTANTE:
#   - Reemplaza projectKey por la CLAVE que definas al crear el proyecto en
#     SonarQube (debe coincidir EXACTAMENTE).
#   - El token NO va aquí: se entrega como variable de entorno / secreto
#     SONAR_TOKEN (en GitHub Actions o en tu terminal al correr el scanner).
# ----------------------------------------------------------------------------

sonar.projectKey=hotel-proyecto
sonar.projectName=Hotel Management System - Backend
sonar.projectVersion=1.0

# URL del servidor SonarQube de la universidad
sonar.host.url=https://sonarqube.inf.uct.cl

# ---- Código fuente y tests (rutas relativas a la raíz del repo) ----
sonar.sources=hotel-prototype/backend/src
sonar.tests=hotel-prototype/backend/tests
sonar.sourceEncoding=UTF-8

# ---- Cobertura: Jest genera LCOV; SonarQube lo consume ----
sonar.javascript.lcov.reportPaths=hotel-prototype/backend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=hotel-prototype/backend/coverage/lcov.info

# ---- Exclusiones de cobertura (capas no testeables por unidad) ----
sonar.coverage.exclusions=\
  hotel-prototype/backend/src/server.ts,\
  hotel-prototype/backend/src/infrastructure/config/environment.ts,\
  hotel-prototype/backend/src/infrastructure/config/database.ts,\
  hotel-prototype/backend/src/infrastructure/persistence/TypeOrmHabitacionRepository.ts,\
  hotel-prototype/backend/src/domain/entities/**,\
  hotel-prototype/backend/src/domain/dtos/**,\
  hotel-prototype/backend/src/domain/ports/**

# ---- Exclusiones generales de análisis ----
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  hotel-prototype/frontend/**
