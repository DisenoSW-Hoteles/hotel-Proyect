<div class="admin-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="sidebar__brand">
      <div class="sidebar__logo">
        <span class="material-icons">hotel</span>
      </div>
      <div>
        <span class="sidebar__brand-name">Hotel Admin</span>
        <span class="sidebar__brand-sub">Panel de Gestión</span>
      </div>
    </div>

    <nav class="sidebar__nav">
      <span class="sidebar__section-label">Recepción</span>

      <a routerLink="/admin/front-desk/check-in"
         routerLinkActive="nav-link--active"
         class="nav-link">
        <span class="material-icons">login</span>
        Check-in
      </a>

      <a routerLink="/admin/front-desk/check-out"
         routerLinkActive="nav-link--active"
         class="nav-link">
        <span class="material-icons">logout</span>
        Check-out
      </a>

      <span class="sidebar__section-label" style="margin-top: 1.5rem;">Gestión</span>

      <a routerLink="/admin/rooms"
         routerLinkActive="nav-link--active"
         class="nav-link">
        <span class="material-icons">meeting_room</span>
        Habitaciones
      </a>
    </nav>

    <div class="sidebar__footer">
      <ng-container *ngIf="currentUser$ | async as user">
        <div class="sidebar__user">
          <div class="sidebar__avatar">
            <span class="material-icons">person</span>
          </div>
          <div class="sidebar__user-info">
            <span class="sidebar__user-name">{{ user.name }}</span>
            <span class="sidebar__user-role">{{ user.role }}</span>
          </div>
        </div>
      </ng-container>

      <button class="nav-link nav-link--logout" (click)="logout()">
        <span class="material-icons">power_settings_new</span>
        Cerrar Sesión
      </button>
    </div>

  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="admin-main">
    <router-outlet />
  </main>

</div>
